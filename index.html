<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuws - Un site d'information simple</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --text-color: #ffffff;
            --text-secondary: #a1a1a1;
            --accent-color: #0071e3;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* En-tête / Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: rgba(13, 13, 13, 0.8);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo-nav {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 600;
            font-size: 20px;
        }

        .logo-svg {
            width: 32px;
            height: 32px;
            fill: currentColor;
        }

        /* Écran d'accueil / Hero Section */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 100px 20px 80px;
            min-height: 70vh;
        }

        .hero-logo {
            width: 180px;
            height: 180px;
            margin-bottom: 32px;
            filter: drop-shadow(0 0 30px rgba(255, 255, 255, 0.15));
            transition: transform 0.5s ease;
        }

        .hero-logo:hover {
            transform: scale(1.05);
        }

        .hero h1 {
            font-size: 56px;
            font-weight: 700;
            letter-spacing: -0.015em;
            margin-bottom: 16px;
            background: linear-gradient(180deg, #ffffff 0%, #a1a1a1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 22px;
            color: var(--text-secondary);
            max-width: 600px;
            line-height: 1.4;
            margin-bottom: 40px;
        }

        .btn-primary {
            background-color: var(--text-color);
            color: var(--bg-color);
            padding: 14px 32px;
            border-radius: 980px;
            font-size: 17px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background-color: #e5e5e5;
            transform: scale(1.02);
        }

        /* Feed d'actualités / Contenu */
        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
            width: 100%;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            font-size: 18px;
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 16px;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo-nav">
            <!-- SVG du nouveau Logo N -->
            <svg class="logo-svg" viewBox="0 0 100 100">
                <path d="M 20 15 L 35 15 L 35 85 L 20 85 Z M 40 15 L 55 15 L 80 85 L 65 85 Z M 65 15 L 80 15 L 80 85 L 65 85 Z" />
            </svg>
            <span>Nuws</span>
        </a>
    </header>

    <section class="hero">
        <!-- SVG du nouveau Logo N en grand -->
        <svg class="hero-logo" viewBox="0 0 100 100">
            <path fill="#ffffff" d="M 20 15 L 35 15 L 35 85 L 20 85 Z M 40 15 L 55 15 L 80 85 L 65 85 Z M 65 15 L 80 15 L 80 85 L 65 85 Z" />
        </svg>
        <h1>Bienvenue sur Nuws</h1>
        <p>Un site d'information simple, épuré et décrypté.</p>
        <a href="#articles" class="btn-primary">Découvrir l'actualité</a>
    </section>

    <main id="articles">
        <div class="empty-state">
            <p>Aucun article disponible pour le moment.</p>
        </div>
    </main>

</body>
</html>
