<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuws — Actualités & Médias</title>
  
  <!-- Polices système & Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --nav-bg: rgba(0, 0, 0, 0.82);
      --primary: #0071e3;
      --primary-hover: #0077ed;
      --text: #1d1d1f;
      --text-muted: #86868b;
      --border: rgba(0, 0, 0, 0.08);
      --radius-lg: 20px;
      --radius-md: 14px;
      --shadow-apple: 0 12px 32px rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Bandeau supérieur Apple Glass (Frosted Black) */
    .glass-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--nav-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .header-container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0.85rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Logo Nuws exact (SVG vectoriel fidèle à l'image) */
    .brand-logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: white;
      transition: opacity 0.2s;
    }

    .brand-logo:hover {
      opacity: 0.85;
    }

    .brand-logo svg {
      height: 28px;
      width: auto;
    }

    /* Actions utilisateur */
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .btn-apple {
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 0.55rem 1.1rem;
      border-radius: 980px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-apple:hover {
      transform: scale(1.02);
      background: #e8e8ed;
    }

    .user-pill {
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.875rem;
      background: rgba(255, 255, 255, 0.12);
      padding: 0.4rem 0.9rem;
      border-radius: 980px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-link-dark {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.7);
      cursor: pointer;
      font-size: 0.85rem;
      margin-left: 0.5rem;
    }

    .btn-link-dark:hover { color: white; }

    /* Layout principal */
    main {
      max-width: 1140px;
      margin: 2rem auto 4rem;
      padding: 0 1.5rem;
      width: 100%;
      flex: 1;
    }

    /* Apple TV Hero Carousel */
    .hero-carousel-section {
      position: relative;
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      background: #000;
      margin-bottom: 3rem;
      height: 420px;
    }

    .carousel-track {
      display: flex;
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .carousel-slide {
      min-width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: flex-end;
      padding: 3rem;
      background-size: cover;
      background-position: center;
    }

    .slide-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1) 100%);
    }

    .slide-content {
      position: relative;
      z-index: 2;
      color: white;
      max-width: 650px;
    }

    .slide-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      padding: 0.35rem 0.85rem;
      border-radius: 980px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.8rem;
    }

    .slide-badge.youtube { background: rgba(255, 0, 0, 0.8); }

    .slide-title {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 0.8rem;
      letter-spacing: -0.01em;
    }

    .slide-desc {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 1.5rem;
      line-height: 1.4;
    }

    .slide-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #ffffff;
      color: #000;
      padding: 0.75rem 1.5rem;
      border-radius: 980px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      transition: transform 0.2s;
    }

    .slide-btn:hover { transform: scale(1.03); }

    /* Pagination Apple TV Dots */
    .carousel-dots {
      position: absolute;
      bottom: 1.2rem;
      right: 2rem;
      z-index: 10;
      display: flex;
      gap: 0.5rem;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .dot.active {
      background: #ffffff;
      width: 24px;
      border-radius: 10px;
    }

    /* Barre de Recherche Intelligente (Fuzzy Search) */
    .search-section {
      margin-bottom: 2.5rem;
    }

    .smart-search-wrapper {
      position: relative;
      max-width: 680px;
      margin: 0 auto;
    }

    .smart-search-wrapper i {
      position: absolute;
      left: 1.25rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .smart-search-input {
      width: 100%;
      padding: 1.1rem 1.25rem 1.1rem 3.2rem;
      border-radius: 980px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      font-size: 1.05rem;
      outline: none;
      box-shadow: var(--shadow-apple);
      transition: all 0.2s ease;
    }

    .smart-search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
    }

    .search-hint {
      text-align: center;
      font-size: 0.825rem;
      color: var(--text-muted);
      margin-top: 0.6rem;
    }

    /* Grille de Contenu */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 1.5rem;
    }

    .section-header h2 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .content-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .apple-card {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-apple);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s;
      display: flex;
      flex-direction: column;
    }

    .apple-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.09);
    }

    .card-thumb {
      height: 180px;
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .card-body {
      padding: 1.4rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-tag {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.4rem;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 0.6rem;
    }

    .card-text {
      color: #515154;
      font-size: 0.925rem;
      line-height: 1.5;
      flex: 1;
      margin-bottom: 1rem;
    }

    .card-footer {
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 0.75rem;
      display: flex;
      justify-content: space-between;
    }

    /* Modal Apple Connexion / Création de compte */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .apple-modal {
      background: var(--card-bg);
      width: 100%;
      max-width: 420px;
      border-radius: var(--radius-lg);
      padding: 2.2rem;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
      position: relative;
    }

    .modal-tabs {
      display: flex;
      background: #e8e8ed;
      padding: 3px;
      border-radius: 980px;
      margin-bottom: 1.5rem;
    }

    .tab-btn {
      flex: 1;
      padding: 0.5rem;
      border: none;
      background: transparent;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 980px;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--text-muted);
    }

    .tab-btn.active {
      background: white;
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .input-field {
      margin-bottom: 1.1rem;
    }

    .input-field label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
      color: #333;
    }

    .apple-input {
      width: 100%;
      padding: 0.8rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fbfbfd;
      font-size: 0.95rem;
      outline: none;
    }

    .apple-input:focus {
      border-color: var(--primary);
      background: #ffffff;
    }

    .close-modal-btn {
      position: absolute;
      top: 1.25rem;
      right: 1.25rem;
      background: #e8e8ed;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #555;
    }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- Bandeau Supérieur Noir effet Verre Trempé -->
  <header class="glass-header">
    <div class="header-container">
      <a href="#" class="brand-logo" aria-label="Nuws Home">
        <!-- SVG Fidèle au Logo Nuws✦ -->
        <svg viewBox="0 0 220 60" fill="none" xmlns="http://www.w3.org/2000/svg">
          <text x="0" y="46" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-weight="800" font-size="48" fill="#ffffff" letter-spacing="-1">Nuws</text>
          <!-- Étoile / Éclat 4 branches -->
          <path d="M142 16 C142 22 146 25 152 25 C146 25 142 28 142 34 C142 28 138 25 132 25 C138 25 142 22 142 16 Z" fill="#ffffff"/>
        </svg>
      </a>

      <div class="nav-actions" id="nav-user-slot">
        <!-- Rempli dynamiquement en JS -->
      </div>
    </div>
  </header>

  <main>
    <!-- Carrousel Style Apple TV (Actualités & Vidéos YouTube) -->
    <section class="hero-carousel-section">
      <div class="carousel-track" id="carousel-track">
        <!-- Contenu injecté dynamiquement -->
      </div>
      <div class="carousel-dots" id="carousel-dots"></div>
    </section>

    <!-- Recherche Intelligente (Tolérance aux fautes) -->
    <section class="search-section">
      <div class="smart-search-wrapper">
        <i data-lucide="search" size="20"></i>
        <input type="text" id="smart-search" class="smart-search-input" placeholder="Rechercher un sujet, une actu ou une vidéo YouTube..." autocomplete="off">
      </div>
      <p class="search-hint">Recherche intelligente avec correction automatique d'erreurs de frappe.</p>
    </section>

    <!-- Feed de publications -->
    <div class="section-header">
      <h2>Dernières publications</h2>
    </div>

    <section class="content-grid" id="main-grid">
      <!-- Cartes injectées en JS -->
    </section>
  </main>

  <!-- Fenêtre Modale de Connexion / Inscription -->
  <div class="modal-backdrop" id="auth-modal">
    <div class="apple-modal">
      <button class="close-modal-btn" id="close-modal-btn"><i data-lucide="x" size="16"></i></button>
      
      <div class="modal-tabs">
        <button class="tab-btn active" id="tab-login">Connexion</button>
        <button class="tab-btn" id="tab-register">Créer un compte</button>
      </div>

      <!-- Formulaire Connexion -->
      <form id="form-login">
        <div class="input-field">
          <label for="login-email">Adresse e-mail</label>
          <input type="email" id="login-email" class="apple-input" placeholder="nom@exemple.com" required>
        </div>
        <div class="input-field">
          <label for="login-pass">Mot de passe</label>
          <input type="password" id="login-pass" class="apple-input" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-apple" style="width: 100%; justify-content: center; padding: 0.8rem; margin-top: 0.5rem; background: var(--primary); color: white;">
          Se connecter
        </button>
      </form>

      <!-- Formulaire Inscription -->
      <form id="form-register" style="display: none;">
        <div class="input-field">
          <label for="reg-name">Nom complet</label>
          <input type="text" id="reg-name" class="apple-input" placeholder="Alex Morgan" required>
        </div>
        <div class="input-field">
          <label for="reg-email">Adresse e-mail</label>
          <input type="email" id="reg-email" class="apple-input" placeholder="nom@exemple.com" required>
        </div>
        <div class="input-field">
          <label for="reg-pass">Mot de passe</label>
          <input type="password" id="reg-pass" class="apple-input" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-apple" style="width: 100%; justify-content: center; padding: 0.8rem; margin-top: 0.5rem; background: var(--primary); color: white;">
          Créer mon compte
        </button>
      </form>
    </div>
  </div>

  <script>
    // --- Initialisation des icônes ---
    lucide.createIcons();

    // --- Base de données du site (Actus & YouTube) ---
    const database = [
      {
        id: "yt-1",
        type: "youtube",
        title: "Les NUWS aux STATES : Édition spéciale",
        category: "YouTube • Vidéo",
        date: "8 août 2026",
        description: "Analyse complète et décryptage des mouvements politiques et économiques récents à travers les États-Unis.",
        image: "https://images.unsplash.com/photo-1508433957232-3107f5fd5995?auto=format&fit=crop&w=1200&q=80",
        link: "https://youtube.com",
        featured: true
      },
      {
        id: "news-1",
        type: "news",
        title: "Lancement de la nouvelle expérience Nuws",
        category: "Actualité",
        date: "8 août 2026",
        description: "Découvrez notre nouveau média indépendant axé sur l'information fluide, rapide et accessible.",
        image: "https://images.unsplash.com/photo-1585829365295-ab7cd400c167?auto=format&fit=crop&w=1200&q=80",
        link: "#",
        featured: true
      },
      {
        id: "yt-2",
        type: "youtube",
        title: "Reportage : En immersion dans la tech américaine",
        category: "YouTube • Short",
        date: "7 août 2026",
        description: "Focus sur les dernières innovations de la Silicon Valley et l'impact sur le paysage numérique global.",
        image: "https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&w=800&q=80",
        link: "https://youtube.com",
        featured: false
      },
      {
        id: "news-2",
        type: "news",
        title: "Économie et Médias : Le grand virage de 2026",
        category: "Analyse",
        date: "5 août 2026",
        description: "Comment la consommation de l'information évolue vers des plateformes directes et sans intermédiaires.",
        image: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=800&q=80",
        link: "#",
        featured: false
      }
    ];

    // --- Moteur de Carrousel Apple TV ---
    const featuredItems = database.filter(item => item.featured);
    const track = document.getElementById('carousel-track');
    const dotsContainer = document.getElementById('carousel-dots');
    let currentSlide = 0;

    function renderCarousel() {
      track.innerHTML = featuredItems.map(item => `
        <div class="carousel-slide" style="background-image: url('${item.image}');">
          <div class="slide-overlay"></div>
          <div class="slide-content">
            <span class="slide-badge ${item.type === 'youtube' ? 'youtube' : ''}">
              <i data-lucide="${item.type === 'youtube' ? 'play-circle' : 'newspaper'}" size="14"></i>
              ${item.category}
            </span>
            <h1 class="slide-title">${item.title}</h1>
            <p class="slide-desc">${item.description}</p>
            <a href="${item.link}" target="_blank" class="slide-btn">
              <span>${item.type === 'youtube' ? 'Regarder la vidéo' : 'Lire l\'actualité'}</span>
              <i data-lucide="arrow-right" size="16"></i>
            </a>
          </div>
        </div>
      `).join('');

      dotsContainer.innerHTML = featuredItems.map((_, i) => `
        <div class="dot ${i === 0 ? 'active' : ''}" onclick="goToSlide(${i})"></div>
      `).join('');

      lucide.createIcons();
    }

    function goToSlide(index) {
      currentSlide = index;
      track.style.transform = `translateX(-${index * 100}%)`;
      document.querySelectorAll('.dot').forEach((dot, i) => {
        dot.classList.toggle('active', i === index);
      });
    }

    // Défilement automatique
    setInterval(() => {
      currentSlide = (currentSlide + 1) % featuredItems.length;
      goToSlide(currentSlide);
    }, 6000);

    // --- Moteur de Recherche Intelligente (Tolérance aux fautes / Levenshtein) ---
    function levenshteinDistance(a, b) {
      const matrix = [];
      for (let i = 0; i <= b.length; i++) matrix[i] = [i];
      for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          if (b.charAt(i - 1) === a.charAt(j - 1)) {
            matrix[i][j] = matrix[i - 1][j - 1];
          } else {
            matrix[i][j] = Math.min(
              matrix[i - 1][j - 1] + 1,
              Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1)
            );
          }
        }
      }
      return matrix[b.length][a.length];
    }

    function fuzzyMatch(query, text) {
      const q = query.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
      const t = text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

      if (!q) return true;

      const qWords = q.split(/\s+/);
      const tWords = t.split(/\s+/);

      return qWords.every(qWord => {
        // Recherche sous-chaîne exacte
        if (t.includes(qWord)) return true;
        // Recherche avec marge d'erreur pour les fautes de frappe
        return tWords.some(tWord => {
          if (tWord.length <= 2) return tWord === qWord;
          const maxAllowedErrors = qWord.length > 5 ? 2 : 1;
          return levenshteinDistance(qWord, tWord) <= maxAllowedErrors;
        });
      });
    }

    // --- Afficha
