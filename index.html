<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuws — Moteur d'Actualité & IA</title>
  <!-- Google Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 14px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navbar */
    .navbar {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
    }

    .logo span { color: var(--primary); }

    .user-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .btn {
      padding: 0.6rem 1.2rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-outline {
      background-color: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-outline:hover {
      background-color: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.4rem 0.8rem;
      background: var(--primary-light);
      border-radius: 30px;
      border: 1px solid rgba(37, 99, 235, 0.2);
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
    }

    /* Main Container */
    .main-container {
      max-width: 900px;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
      flex: 1;
      width: 100%;
    }

    /* Hero / AI Search Engine Section */
    .ai-search-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: var(--shadow);
      margin-bottom: 2.5rem;
    }

    .ai-search-header {
      margin-bottom: 1.2rem;
    }

    .ai-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--primary-light);
      color: var(--primary);
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }

    .ai-search-header h2 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .search-box {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .search-input-wrapper {
      position: relative;
      flex: 1;
    }

    .search-input-wrapper i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .search-input {
      width: 100%;
      padding: 0.9rem 1rem 0.9rem 2.8rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    /* AI Response Box */
    .ai-response {
      margin-top: 1.5rem;
      padding: 1.25rem;
      background: var(--bg);
      border-radius: 10px;
      border: 1px solid var(--border);
      display: none;
    }

    .ai-response.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    .ai-response-title {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .ai-response-body {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #334155;
    }

    /* Feed Section */
    .section-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .news-feed {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
      transition: transform 0.2s;
    }

    .news-card:hover {
      transform: translateY(-2px);
    }

    .news-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.6rem;
      font-size: 0.825rem;
    }

    .category-tag {
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 700;
      padding: 0.2rem 0.6.rem;
      border-radius: 6px;
    }

    .news-date {
      color: var(--text-muted);
    }

    .news-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .news-excerpt {
      color: #475569;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    /* Modal Connexion */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: var(--card-bg);
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      padding: 2rem;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .modal-title {
      font-size: 1.3rem;
      font-weight: 800;
    }

    .close-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
    }

    .form-control {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--primary);
    }

    .modal-footer {
      margin-top: 1.5rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="nav-container">
      <a href="#" class="logo">
        <i data-lucide="sparkles" style="color: var(--primary);"></i>
        Nuws<span>.</span>
      </a>
      <div class="user-actions" id="auth-actions">
        <!-- Boutons dynamiques gérés par JavaScript -->
      </div>
    </div>
  </header>

  <!-- Contenu Principal -->
  <main class="main-container">

    <!-- Bloc Moteur IA Nuws -->
    <section class="ai-search-card">
      <div class="ai-search-header">
        <span class="ai-badge"><i data-lucide="bot" size="14"></i> Nuws AI Engine</span>
        <h2>Posez une question ou cherchez une actualité</h2>
      </div>
      <form id="ai-form" class="search-box">
        <div class="search-input-wrapper">
          <i data-lucide="search" size="18"></i>
          <input type="text" id="ai-input" class="search-input" placeholder="Ex: Que se passe-t-il aux États-Unis aujourd'hui ?" required>
        </div>
        <button type="submit" class="btn btn-primary" id="ai-submit-btn">
          <span>Générer</span>
          <i data-lucide="arrow-right" size="16"></i>
        </button>
      </form>

      <!-- Résultat de la synthèse IA -->
      <div id="ai-response" class="ai-response">
        <div class="ai-response-title">
          <i data-lucide="cpu" size="16"></i> Synthèse Nuws AI
        </div>
        <div id="ai-response-text" class="ai-response-body"></div>
      </div>
    </section>

    <!-- Fil d'actualités -->
    <div class="section-title">
      <span><i data-lucide="newspaper" size="18" style="vertical-align: middle; margin-right: 6px;"></i> Derniers Flashs</span>
    </div>

    <section id="news-feed" class="news-feed">
      <!-- Les articles seront générés ici -->
    </section>
  </main>

  <!-- Modal de Connexion / Inscription -->
  <div class="modal-overlay" id="auth-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">Connexion à Nuws</h3>
        <button class="close-btn" id="close-modal"><i data-lucide="x" size="20"></i></button>
      </div>
      <form id="auth-form">
        <div class="form-group">
          <label for="email">Adresse E-mail</label>
          <input type="email" id="email" class="form-control" placeholder="nom@exemple.com" required>
        </div>
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
            Se connecter
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // --- Initialisation des icônes ---
    lucide.createIcons();

    // --- Données d'actualités de démonstration ---
    const initialArticles = [
      {
        id: 1,
        title: "Lancement officiel de la plateforme intelligente Nuws",
        category: "Technologie",
        date: "8 août 2026",
        content: "Nuws déploie son nouveau moteur de recherche et de synthèse d'actualités alimenté par l'intelligence artificielle pour offrir une information claire, directe et vérifiée."
      },
      {
        id: 2,
        title: "Flash USA : Résumé des grands enjeux récents",
        category: "International",
        date: "8 août 2026",
        content: "Découvrez la synthèse hebdomadaire des évolutions politiques, économiques et sociétales majeures sur le territoire américain."
      }
    ];

    // --- Gestion de l'état de la connexion (Auth) ---
    const authActions = document.getElementById('auth-actions');
    const authModal = document.getElementById('auth-modal');
    const closeModal = document.getElementById('close-modal');
    const authForm = document.getElementById('auth-form');

    function checkAuthState() {
      const user = JSON.parse(localStorage.getItem('nuws_user'));
      if (user) {
        const initial = user.email.charAt(0).toUpperCase();
        authActions.innerHTML = `
          <div class="user-profile">
            <div class="avatar">${initial}</div>
            <span style="font-size: 0.85rem; font-weight: 600;">${user.email.split('@')[0]}</span>
          </div>
          <button class="btn btn-outline" id="logout-btn">
            <i data-lucide="log-out" size="16"></i> Déconnexion
          </button>
        `;
        document.getElementById('logout-btn').addEventListener('click', logout);
      } else {
        authActions.innerHTML = `
          <button class="btn btn-primary" id="login-btn">
            <i data-lucide="user" size="16"></i> Connexion
          </button>
        `;
        document.getElementById('login-btn').addEventListener('click', () => {
          authModal.classList.add('active');
        });
      }
      lucide.createIcons();
    }

    function logout() {
      localStorage.removeItem('nuws_user');
      checkAuthState();
    }

    closeModal.addEventListener('click', () => {
      authModal.classList.remove('active');
    });

    authForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      localStorage.setItem('nuws_user', JSON.stringify({ email }));
      authModal.classList.remove('active');
      checkAuthState();
    });

    // --- Affichage du Fil d'Actualités ---
    function renderNews() {
      const feed = document.getElementById('news-feed');
      feed.innerHTML = initialArticles.map(art => `
        <article class="news-card">
          <div class="news-meta">
            <span class="category-tag">${art.category}</span>
            <span class="news-date">${art.date}</span>
          </div>
          <h3 class="news-title">${art.title}</h3>
          <p class="news-excerpt">${art.content}</p>
        </article>
      `).join('');
    }

    // --- Moteur d'IA Nuws (Simulation de traitement intelligent) ---
    const aiForm = document.getElementById('ai-form');
    const aiInput = document.getElementById('ai-input');
    const aiResponse = document.getElementById('ai-response');
    const aiResponseText = document.getElementById('ai-response-text');
    const aiSubmitBtn = document.getElementById('ai-submit-btn');

    aiForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const query = aiInput.value.trim();
      if (!query) return;

      // Animation de chargement
      aiSubmitBtn.disabled = true;
      aiSubmitBtn.innerHTML = `<span>Analyse...</span>`;
      aiResponse.classList.remove('active');

      setTimeout(() => {
        aiSubmitBtn.disabled = false;
        aiSubmitBtn.innerHTML = `<span>Générer</span> <i data-lucide="arrow-right" size="16"></i>`;
        lucide.createIcons();

        // Réponse simulée de l'IA Nuws
        const responseText = `Voici la synthèse Nuws pour "<strong>${query}</strong>" :<br><br>
        • <strong>Point clé 1 :</strong> Les récentes analyses indiquent une accélération des échanges et des informations ciblées sur ce sujet.<br>
        • <strong>Point clé 2 :</strong> Nuws AI regroupe les sources vérifiées pour vous fournir une couverture synthétique et sans filtre.<br><br>
        <em>Mise à jour en direct enregistrée par le moteur Nuws.</em>`;

        aiResponseText.innerHTML = responseText;
        aiResponse.classList.add('active');
      }, 1000);
    });

    // --- Démarrage ---
    checkAuthState();
    renderNews();
  </script>
</body>
</html>
